              ("5.15", "Input Validation", "SI", "Validazione degli input implementari"),
              ("5.16", "Input Validation", "SI", "Validazione degli output implementari"),
          ]

          margin = 30
          table_width = page_width - 2 * margin
          column_widths = [42, 205, 95, table_width - 42 - 205 - 95]
          header_height = 30
          row_height = 42
