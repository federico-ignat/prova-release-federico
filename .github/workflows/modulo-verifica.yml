name: Genera modulo PDF compilabile dei controlli

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genera-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installa ReportLab
        run: python -m pip install reportlab

      - name: Genera il modulo PDF compilabile
        run: |
          python - <<'PY'
          from reportlab.lib import colors
          from reportlab.lib.pagesizes import A4, landscape
          from reportlab.pdfgen import canvas

          filename = "modulo-verifica-controlli.pdf"
          page_width, page_height = landscape(A4)
          pdf = canvas.Canvas(filename, pagesize=landscape(A4))
          form = pdf.acroForm

          controls = [
              ("5.1", "Controllo del codice sorgente", "SI", ""),
              ("5.2", "Gestione del repository", "SI", ""),
              ("5.3", "Revisione e analisi del codice", "SI", ""),
              ("5.4", "Gestione delle vulnerabilità", "NO", "Libreria N.Cafe 5.11.0 non applicabile"),
              ("5.5", "Bootstrapping", "SI", ""),
              ("5.6", "Gestione parametri di configurazione", "SI", "Gestione tramite file di configurazione"),
              ("5.7", "Cryptographic Agility", "SI", ""),
              ("5.8", "Gestione della memoria", "SI", ""),
              ("5.9", "Type-Safe Practices", "SI", ""),
              ("5.10", "Locality", "SI", ""),
              ("5.11", "Gestione degli errori", "SI", "Gestione delle eccezioni implementari"),
              ("5.12", "Interface Coding (API)", "SI", ""),
              ("5.13", "Session Management", "NO", "Applicazione stateless, nessuna sessione utente"),
              ("5.14", "Strumenti di cifratura", "SI", ""),
              ("5.15", "Input Validation", "SI", "Validazione degli input implementari"),
              ("5.16", "Input Validation", "SI", "Validazione degli output implementari"),
          ]

          margin = 30
          table_width = page_width - 2 * margin
          column_widths = [42, 205, 95, table_width - 42 - 205 - 95]
          header_height = 30
          row_height = 42
          headings = ["N°", "Controllo", "Implementazione", "Descrizione"]
          pages = [controls[:8], controls[8:]]

          def draw_page(page_number, page_controls):
              if page_number == 1:
                  pdf.setFont("Helvetica-Bold", 15)
                  pdf.drawCentredString(
                      page_width / 2,
                      page_height - 34,
                      "DOCUMENTO DI APPLICABILITÀ DEI CONTROLLI",
                  )
                  pdf.setFont("Helvetica", 8)
                  pdf.drawString(
                      margin,
                      page_height - 51,
                      "Compila o modifica i campi Implementazione e Descrizione direttamente nel PDF.",
                  )
                  table_top = page_height - 68
              else:
                  # La seconda pagina non ripete titolo e sottotitolo.
                  table_top = page_height - 28

              pdf.drawRightString(page_width - margin, 20, f"Pagina {page_number} di 2")

              table_bottom = table_top - header_height - len(page_controls) * row_height
              xs = [margin]
              for width in column_widths:
                  xs.append(xs[-1] + width)

              pdf.setFillColor(colors.lightgrey)
              pdf.rect(
                  margin,
                  table_top - header_height,
                  table_width,
                  header_height,
                  fill=1,
                  stroke=0,
              )

              pdf.setStrokeColor(colors.black)
              pdf.setLineWidth(0.7)

              for x in xs:
                  pdf.line(x, table_bottom, x, table_top)

              pdf.line(margin, table_top, page_width - margin, table_top)
              pdf.line(
                  margin,
                  table_top - header_height,
                  page_width - margin,
                  table_top - header_height,
              )

              for index in range(len(page_controls)):
                  y = table_top - header_height - (index + 1) * row_height
                  pdf.line(margin, y, page_width - margin, y)

              pdf.setFillColor(colors.black)
              pdf.setFont("Helvetica-Bold", 8)

              for index, heading in enumerate(headings):
                  center = xs[index] + column_widths[index] / 2
                  pdf.drawCentredString(center, table_top - 19, heading)

              for index, (number, control, implementation, description) in enumerate(page_controls):
                  row_top = table_top - header_height - index * row_height
                  row_bottom = row_top - row_height

                  pdf.setFont("Helvetica", 8)
                  pdf.drawCentredString(
                      xs[0] + column_widths[0] / 2,
                      row_bottom + row_height / 2 - 3,
                      number,
                  )
                  pdf.drawString(
                      xs[1] + 6,
                      row_bottom + row_height / 2 - 3,
                      control,
                  )

                  field_name = number.replace(".", "_")

                  form.textfield(
                      name=f"implementazione_{field_name}",
                      tooltip=f"Implementazione controllo {number}",
                      x=xs[2] + 4,
                      y=row_bottom + 5,
                      width=column_widths[2] - 8,
                      height=row_height - 10,
                      value=implementation,
                      fontName="Helvetica",
                      fontSize=9,
                      borderWidth=0,
                      fillColor=None,
                      textColor=colors.black,
                      forceBorder=False,
                  )

                  form.textfield(
                      name=f"descrizione_{field_name}",
                      tooltip=f"Descrizione controllo {number}",
                      x=xs[3] + 4,
                      y=row_bottom + 5,
                      width=column_widths[3] - 8,
                      height=row_height - 10,
                      value=description,
                      fontName="Helvetica",
                      fontSize=8,
                      fieldFlags="multiline",
                      borderWidth=0,
                      fillColor=None,
                      textColor=colors.black,
                      forceBorder=False,
                  )

              pdf.showPage()

          for page_number, page_controls in enumerate(pages, start=1):
              draw_page(page_number, page_controls)

          pdf.save()
          print(f"PDF compilabile generato: {filename}")
          PY

      - name: Carica il PDF come artifact
        uses: actions/upload-artifact@v4
        with:
          name: modulo-verifica-controlli
          path: modulo-verifica-controlli.pdf
          if-no-files-found: error
