name: Genera PDF Release Notes per ISO 27001

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release"
        required: false
        default: ""
      release_name:
        description: "Nome della release"
        required: false
        default: ""
      body:
        description: "Testo della release"
        required: false
        default: ""

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installa librerie per generare il PDF
        run: |
          python -m pip install --disable-pip-version-check reportlab requests

      - name: Genera il documento PDF di rilascio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
          RELEASE_NAME: ${{ github.event.release.name || github.event.inputs.release_name || github.event.inputs.tag || github.ref_name }}
          RELEASE_BODY: ${{ github.event.release.body || github.event.inputs.body || 'Nessuna nota inserita.' }}
          AUTHOR: ${{ github.event.release.author.login || github.actor }}
          RELEASE_DATE: ${{ github.event.release.published_at || github.event.repository.updated_at || github.run_started_at }}
        run: |
          python3 - <<'EOF'
          import os
          from datetime import datetime

          from reportlab.lib import colors
          from reportlab.lib.pagesizes import letter
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.platypus import (
              Paragraph,
              PageBreak,
              SimpleDocTemplate,
              Spacer,
              Table,
              TableStyle,
          )

          repo = os.environ.get("REPOSITORY", "unknown/repository")
          tag = (os.environ.get("TAG_NAME") or "").strip() or "release"
          name = (os.environ.get("RELEASE_NAME") or "").strip() or tag
          body = (os.environ.get("RELEASE_BODY") or "").strip() or "Nessuna nota inserita."
          author = (os.environ.get("AUTHOR") or "Sviluppatore").strip() or "Sviluppatore"
          release_date = (os.environ.get("RELEASE_DATE") or "").strip() or datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")

          safe_tag = tag.replace("/", "-")
          pdf_filename = f"Scheda_Rilascio_{safe_tag}.pdf"

          doc = SimpleDocTemplate(
              pdf_filename,
              pagesize=letter,
              rightMargin=36,
              leftMargin=36,
              topMargin=36,
              bottomMargin=36,
          )

          def add_page_number(canvas, doc):
              page_num = canvas.getPageNumber()
              canvas.setFont("Helvetica", 8)
              canvas.drawString(40, 15, "Scheda di Rilascio")
              canvas.drawRightString(560, 15, f"Pagina {page_num}")

          story = []
          styles = getSampleStyleSheet()

          title_style = ParagraphStyle(
              "TitleStyle",
              parent=styles["Normal"],
              fontName="Helvetica-Bold",
              fontSize=18,
              textColor=colors.HexColor("#1f2937"),
              spaceAfter=12,
          )

          heading_style = ParagraphStyle(
              "HeadingStyle",
              parent=styles["Normal"],
              fontName="Helvetica",
              fontSize=10,
              textColor=colors.HexColor("#374151"),
              spaceAfter=6,
          )

          body_style = ParagraphStyle(
              "BodyStyle",
              parent=styles["Normal"],
              fontSize=10,
              textColor=colors.HexColor("#374151"),
              spaceAfter=2,
          )

          # Intestazione documento
          story.append(Paragraph("SCHEDA DI RILASCIO SOFTWARE", title_style))
          story.append(Spacer(1, 10))

          story.append(Paragraph("INFORMAZIONI PROGETTO", heading_style))

          data_progetto = [
              ["Titolo Progetto", name],
              ["Repository", repo],
              ["Sviluppatore Assegnato", author],
              ["Data inizio sviluppo", "2026-10-30"],
              ["Data di fine", release_date[:10] if len(release_date) >= 10 else release_date],
          ]

          t_progetto = Table(data_progetto, colWidths=[180, 320])
          t_progetto.setStyle(
              TableStyle(
                  [
                      ("GRID", (0, 0), (-1, -1), 1, colors.black),
                      ("BACKGROUND", (0, 0), (0, -1), colors.lightgrey),
                  ]
              )
          )

          story.append(t_progetto)
          story.append(Spacer(1, 15))

          story.append(Paragraph("1. Analisi delle specifiche", heading_style))
          data_analisi = [
              ["Data Apertura", "Data Chiusura", "Note"],
              ["2026-10-30", release_date[:10] if len(release_date) >= 10 else release_date, "Analisi requisiti completata"],
          ]

          t_analisi = Table(data_analisi, colWidths=[120, 120, 260])
          t_analisi.setStyle(
              TableStyle(
                  [
                      ("GRID", (0, 0), (-1, -1), 1, colors.black),
                      ("BACKGROUND", (0, 0), (-1, 0), colors.lightgrey),
                  ]
              )
          )

          story.append(t_analisi)
          story.append(Spacer(1, 15))

          story.append(Paragraph("2. Sviluppo", heading_style))
          data_sviluppo = [
              ["Data di apertura", "Data di completamento", "Branch"],
              ["2026-10-30", release_date[:10] if len(release_date) >= 10 else release_date, tag],
          ]

          t_sviluppo = Table(data_sviluppo, colWidths=[120, 120, 260])
          t_sviluppo.setStyle(
              TableStyle(
                  [
                      ("GRID", (0, 0), (-1, -1), 1, colors.black),
                      ("BACKGROUND", (0, 0), (-1, 0), colors.lightgrey),
                  ]
              )
          )

          story.append(t_sviluppo)
          story.append(Spacer(1, 15))

          story.append(Paragraph("3. Test autonomi dello sviluppiero", heading_style))
          data_test = [
              ["Data di apertura", "Data di completamento", "Bug riscontrati"],
              [
                  "2026-10-30",
                  release_date[:10] if len(release_date) >= 10 else release_date,
                  "- L'action non riusciva ad allegare il PDF \n"
                  "- Errori di sintassi YAML\n"
                  "- Problemi di impaginazione del PDF",
              ],
          ]

          t_test = Table(data_test, colWidths=[120, 120, 260])
          t_test.setStyle(
              TableStyle(
                  [
                      ("GRID", (0, 0), (-1, -1), 1, colors.black),
                      ("BACKGROUND", (0, 0), (-1, 0), colors.lightgrey),
                      ("VALIGN", (0, 0), (-1, -1), "TOP"),
                  ]
              )
          )

          story.append(t_test)
          story.append(Spacer(1, 15))

          story.append(Paragraph("4. Test affiancamento con ICT Manager", heading_style))
          data_validazione = [
              ["Data di apertura", "Data di completamento", "Esito Test"],
              ["2026-10-30", release_date[:10] if len(release_date) >= 10 else release_date, "Completato con esito positivo"],
          ]

          t_validazione = Table(data_validazione, colWidths=[120, 120, 260])
          t_validazione.setStyle(
              TableStyle(
                  [
                      ("GRID", (0, 0), (-1, -1), 1, colors.black),
                      ("BACKGROUND", (0, 0), (-1, 0), colors.lightgrey),
                  ]
              )
          )

          story.append(t_validazione)
          story.append(Spacer(1, 15))

          story.append(Paragraph("5. Validazione per il rilascio", heading_style))
          data_rilascio = [
              ["Data di validazione", "Approvato da", "Note"],
              ["2026-10-30", "Marco Favagrossa", body[:200] if body else ""],
          ]

          t_rilascio = Table(data_rilascio, colWidths=[120, 120, 260])
          t_rilascio.setStyle(
              TableStyle(
                  [
                      ("GRID", (0, 0), (-1, -1), 1, colors.black),
                      ("BACKGROUND", (0, 0), (-1, 0), colors.lightgrey),
                      ("BACKGROUND", (0, 1), (-1, 1), colors.white),
                  ]
              )
          )

          story.append(t_rilascio)
          story.append(Spacer(1, 15))

          story.append(Paragraph("6. Rilascio in produzione", heading_style))
          data_azioni = [
              ["Data di Rilascio", "Responsabile Merge", "Note"],
              ["2026-10-30", "Federico Ignat", body[:200] if body else ""],
          ]

          t_azioni = Table(data_azioni, colWidths=[120, 120, 260])
          t_azioni.setStyle(
              TableStyle(
                  [
                      ("GRID", (0, 0), (-1, -1), 1, colors.black),
                      ("BACKGROUND", (0, 0), (-1, 0), colors.lightgrey),
                  ]
              )
          )

          story.append(t_azioni)
          story.append(Spacer(1, 15))

          story.append(Paragraph("7. Manutenzioni e aggiornamenti", heading_style))
          data_aggiornamenti = [
              ["Feedback ricevuti", "Azioni corretive", "Note"],
              ["Esito positivo", "", ""],
          ]

          t_aggiornamenti = Table(data_aggiornamenti, colWidths=[120, 120, 260])
          t_aggiornamenti.setStyle(
              TableStyle(
                  [
                      ("GRID", (0, 0), (-1, -1), 1, colors.black),
                      ("BACKGROUND", (0, 0), (-1, 0), colors.lightgrey),
                  ]
              )
          )

          story.append(t_aggiornamenti)
          story.append(Spacer(1, 15))

          story.append(PageBreak())
          story.append(Paragraph("8. Azioni corretive", heading_style))

          data_azioni = [
              ["Descrizione azione", "Data inizio e chiusura", "Responsabile dell'azione"],
              [body[:200] if body else "", "", ""],
          ]

          t_azioni = Table(data_azioni, colWidths=[120, 120, 260])
          t_azioni.setStyle(
              TableStyle(
                  [
                      ("GRID", (0, 0), (-1, -1), 1, colors.black),
                      ("BACKGROUND", (0, 0), (-1, 0), colors.lightgrey),
                  ]
              )
          )

          story.append(t_azioni)
          story.append(Spacer(1, 15))

          # Aggiungo una sezione note release se presenti
          if body and body.strip():
              story.append(Paragraph("NOTE DI RILASCIO", heading_style))
              story.append(Paragraph(body, body_style))
              story.append(Spacer(1, 15))

          doc.build(story, onFirstPage=add_page_number, onLaterPages=add_page_number)
          print(f"PDF generato con successo: {pdf_filename}")
          EOF

      - name: Verifica PDF generato
        run: |
          test -s Scheda_Rilascio_*.pdf
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path(".").glob("Scheda_Rilascio_*.pdf"))
          if not files:
              raise SystemExit("Nessun PDF trovato.")
          pdf = files[0]
          data = pdf.read_bytes()
          if not data.startswith(b"%PDF-"):
              raise SystemExit(f"Il file {pdf.name} non sembra un PDF valido.")
          print(f"PDF verificato: {pdf.name} ({len(data)} byte)")
          PY

      - name: Allega il PDF alla Release esistente
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Scheda_Rilascio_*.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Carica PDF come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-test
          path: Scheda_Rilascio_*.pdf
          if-no-files-found: error
