name: Genera PDF Release Notes per ISO 27001

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release"
        required: false
        default: ""
      release_name:
        description: "Nome della release"
        required: false
        default: ""
      body:
        description: "Testo della release"
        required: false
        default: ""

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa libreria per generare il PDF (ReportLab)
        run: |
          pip install reportlab requests

      - name: Genera il documento PDF di rilascio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
          RELEASE_NAME: ${{ github.event.release.name || github.event.inputs.release_name || github.event.inputs.tag || github.ref_name }}
          RELEASE_BODY: ${{ github.event.release.body || github.event.inputs.body || 'Nessuna nota inserita.' }}
          AUTHOR: ${{ github.event.release.author.login || github.actor }}
          RELEASE_DATE: ${{ github.event.release.published_at || github.event.repository.updated_at || github.run_started_at }}
        run: |
          python3 - <<'EOF'
          import os
          import json
          from reportlab.lib.pagesizes import letter
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle, PageBreak
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib import colors

          # Recupera le variabili d'ambiente passate da GitHub
          repo = os.environ['REPOSITORY']
          tag = os.environ['TAG_NAME']
          name = os.environ['RELEASE_NAME'] or tag
          body = os.environ['RELEASE_BODY'] or "Nessuna nota inserita."
          author = os.environ['AUTHOR']
          release_date = os.environ['RELEASE_DATE']


          pdf_filename = f"Scheda_Rilascio_{tag}.pdf"
          doc = SimpleDocTemplate(pdf_filename, pagesize=letter,
                                  rightMargin=36, leftMargin=36,
                                  topMargin=36, bottomMargin=36)
          story = []
          styles = getSampleStyleSheet()

          # Stili personalizzati
          title_style = ParagraphStyle(
              'TitleStyle',
              parent=styles['Helvetica'],
              fontSize=18,
              textColor=colors.HexColor('#1f2937'),
              spaceAfter=12
          )
          heading_style = ParagraphStyle(
              'HeadingStyle',
              parent=styles['Helvetica-Bold'],
              fontSize=10,
              textColor=colors.HexColor('#4b5563'),
              spaceAfter=6
          )
          body_style = ParagraphStyle(
              'BodyStyle',
              parent=styles['Normal'],
              fontSize=10,
              textColor=colors.HexColor('#374151'),
              spaceAfter=8
          )

          # Intestazione documento per conformità ISO 27001
          story.append(Paragraph("ROADMAP RILASCIO PDF", title_style))
          story.append(Spacer(1, 10))
          
          story.append(Paragraph("INFORMAZIONI PROGETTO", heading_style))

          data_progetto = [
              ["Titolo Progetto", name],
              ["Sviluppatore Assegnato", author],
              ["Data inizio sviluppo", "2026-10-30"],
              ["Data di fine",  release_date[:10]],
          ]

          t_progetto = Table(data_progetto, colWidths=[180, 320])

          t_progetto.setStyle(TableStyle([
              ('GRID', (0,0), (-1,-1), 1, colors.black),
              ('BACKGROUND', (0,0), (0,-1), colors.lightgrey),
          ]))

          story.append(t_progetto)
          story.append(Spacer(1, 15))

          story.append(Paragraph("1. Analisi delle specifiche", heading_style))

          data_analisi = [
              ["Data Apertura", "Data Chiusura", "Note"],
              [ "2026-10-30",  release_date[:10], "Analisi requisiti completata"]
          ]

          t_analisi = Table(data_analisi, colWidths=[100, 100, 300])

          t_analisi.setStyle(TableStyle([
              ('GRID', (0,0), (-1,-1), 1, colors.black),
              ('BACKGROUND', (0,0), (-1,0), colors.lightgrey),
          ]))

          story.append(t_analisi)
          story.append(Spacer(1, 15))

          story.append(Paragraph("2. Sviluppo", heading_style))

          data_sviluppo = [
              ["Data di apertura", "Data di completamento", "Branch"],
              [ "2026-10-30",  release_date[:10], tag]
              ]

          t_sviluppo = Table(data_sviluppo, colWidths=[180, 120, 200])

          t_sviluppo.setStyle(TableStyle([
              ('GRID', (0,0), (-1,-1), 1, colors.black),
              ('BACKGROUND', (0,0), (-1,0), colors.lightgrey),
          ]))

          story.append(t_sviluppo)
          story.append(Spacer(1, 15))

          story.append(Paragraph("3. Test autonomi dello sviluppatore", heading_style))

          data_test = [
              ["Data di apertura", "Data di completamento", "Bug riscontrati"],
              [ "2026-10-30",  release_date[:10], 
              "- L'action non riusciva ad allegare Il PDF \n alla release \n" 
              "- Errori di sintassi YAML\n"
              "- Problemi di impaginazione del PDF"]
          ]

          t_test = Table(data_test, colWidths=[180, 120, 200])

          t_test.setStyle(TableStyle([
              ('GRID', (0,0), (-1,-1), 1, colors.black),
              ('BACKGROUND', (0,0), (-1,0), colors.lightgrey),
              ('VALIGN', (0,0), (-1,-1), 'TOP'),
          ]))

          story.append(t_test)
          story.append(Spacer(1, 15))

          story.append(Paragraph("4. Test affiancamento con ICT Manager", heading_style))

          data_validazione = [
              ["Data di apertura", "Data di completamento", "Esito Test"],
              [ "2026-10-30", release_date[:10], "Completato con esito positivo"]
          ]

          t_validazione = Table(
              data_validazione, 
              colWidths=[120, 120, 260]
          )

          t_validazione.setStyle(TableStyle([
              ('GRID', (0,0), (-1,-1), 1, colors.black),
              ('BACKGROUND', (0,0), (-1,0), colors.lightgrey),
          ]))

          story.append(t_validazione)
          story.append(Spacer(1, 15))

          story.append(Paragraph("5. Validazione per il rilascio", heading_style))

          data_rilascio = [
              ["Data di validazione", "Approvato da", "Note"],
              [ "2026-10-30", "Marco Favagrossa", ""]
          ]

          t_rilascio = Table(
              data_rilascio, 
              colWidths=[120, 120, 260]
          )

          t_rilascio.setStyle(TableStyle([
              ('GRID', (0,0), (-1,-1), 1, colors.black),
              ('BACKGROUND', (0,0), (-1, 0), colors.lightgrey),
              ('BACKGROUND', (0,1), (-1, 1), colors.white),
          ]))

          story.append(t_rilascio)
          story.append(Spacer(1, 15))

          story.append(Paragraph("6. Rilascio in produzione", heading_style))

          data_azioni = [
              ["Data di Rilascio", "Responsabile Merge", "Note"],
              [ "2026-10-30", "Federico Ignat", ""]
          ]

          t_azioni = Table(
              data_azioni,
              colWidths=[120, 120, 260]
          )

          t_azioni.setStyle(TableStyle([
              ('GRID', (0,0), (-1,-1), 1, colors.black),
              ('BACKGROUND', (0,0), (-1,0), colors.lightgrey),
          ]))

          story.append(t_azioni)
          story.append(Spacer(1,15))

          
          story.append(Paragraph("7. Manutenzioni e aggiornamenti", heading_style))

          data_azioni = [
              ["Feedback ricevuti", "Azioni corretive(se previste)", "Note"],
              [ "Esito positivo", "", ""]
          ]

          t_azioni = Table(
              data_azioni,
              colWidths=[120, 120, 260]
          )

          t_azioni.setStyle(TableStyle([
              ('GRID', (0,0), (-1,-1), 1, colors.black),
              ('BACKGROUND', (0,0), (-1,0), colors.lightgrey),
          ]))

          story.append(t_azioni)
          story.append(Spacer(1,15))

          
          story.append(Paragraph("8. Azioni correttive(fase eventuale)", heading_style))

          data_azioni = [
              ["Descrizione azione", "Data inizio e chiusura", "Responsabile dell'azione"],
              [ "", "", ""]
          ]

          t_azioni = Table(
              data_azioni,
              colWidths=[120, 120, 260]
          )

          t_azioni.setStyle(TableStyle([
              ('GRID', (0,0), (-1,-1), 1, colors.black),
              ('BACKGROUND', (0,0), (-1,0), colors.lightgrey),
          ]))

          story.append(t_azioni)
          story.append(Spacer(1,15))

          story.append(
          Paragraph(
          "DOCUMENTO DI APPLICABILITA' DEI CONTROLLI",
          title_style
              )
          )

          story.append(Spacer(1,15))

          data_controlli = [
          ["N°", "Controllo", "Implementazione", "Descrizione"],
          ["5.1", "Controllo del codice sorgente", "SI", ""],
          ["5.2", "Gestione del repository", "SI", ""],
          ["5.3", "Revisione e analisi del codice", "SI", ""],
          ["5.4", "Gestione delle vulnerabilità", "NO", "Libreria N.Cafe 5.11.0 non applicabile"],
          ["5.5", "Bootstrapping", "SI", ""],
          ["5.6", "Gestione parametri di configurazione", "SI", "Gestione tramite file di congigurazione"],
          ["5.7", "Cryptographic Agility", "SI", ""],
          ["5.8", "Gestione della memoria", "SI", ""],
          ["5.9", "Type-Safe Practices", "SI", ""],
          ["5.10", "Locality", "SI", ""],
          ["5.11", "Gestione degli errori", "SI", "Gestione delle eccezioni implementari"],
          ["5.12", "Interface Coding (API)", "SI", ""],
          ["5.13", "Session Management", "NO", "Applicazione stateless, nessuna sessione utente"],
          ["5.14", "Strumenti di cifratura", "SI", ""],
          ["5.15", "Input Validation", "SI", "Validazione degli input implementari"], 
          ["5.16", "Input Validation", "SI", "Validazione degli output implementari"]
          
            ]

          t_controlli = Table(
          data_controlli,
          colWidths=[45 , 180, 90, 225]
            )

          t_controlli.setStyle(TableStyle([
          ('GRID', (0,0), (-1,-1), 1, colors.black),
          ('BACKGROUND', (0,0), (-1,0), colors.lightgrey),
            ]))

          story.append(t_controlli)
            
          
          doc.build(story)  
          print("PDF generato con successo.")
          EOF

      - name: Allega il PDF alla Release esistente
        uses: softprops/action-gh-release@v2
        with:
          files: Scheda_Rilascio_${{ github.event.release.tag_name }}.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
