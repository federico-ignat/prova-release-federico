name: Genera modulo PDF compilabile dei controlli

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genera-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installa ReportLab
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Genera il modulo PDF compilabile
        run: |
          python - <<'PY'
